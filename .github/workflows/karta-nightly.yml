# karta nightly — ночная перегенерация карты из живого API.
# Мир: scheduled workflow + защита от silent output failure (exit 0 при нуле записей).
# Эмерджентное: КРИТИК встроен в пайплайн — «ноль подозрителен» и «штамп обязан быть свежим».
# Положить в: karta/.github/workflows/karta-nightly.yml
# Секрет: KARTA_TOKEN — тонкий fine-grained read-only с датой смерти (канон ФИТИЛЬ, Приказ №6).
name: karta nightly (перегенерация из API)

on:
  schedule:
    # 03:21 UTC — ночная тишина, за час до смены автопилота (04:21)
    - cron: '21 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write   # v4: КРИТИК-ФСМ открывает тревоги без внешних секретов

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Перегенерация карты (тонкий read-only токен)
        env:
          # тонкий ключ с датой смерти; если не задан — встроенный GITHUB_TOKEN (медленнее из-за лимитов)
          GH_TOKEN: ${{ secrets.KARTA_TOKEN || secrets.GITHUB_TOKEN }}
          # v3 умеет KARTA_OUT: карта пишется прямо в корень репо (иначе упала бы в ./karta)
          KARTA_OUT: ${{ github.workspace }}
        run: python3 scripts/gen_karta.py
        # Генератор v3 самодостаточен: факты зеркала (MIRROR_*) — подписанные константы,
        # путей машины не требует. Заявки CLAIMS против живого API — секция СВЕРКА.

      - name: КРИТИК — штамп свежий и ноль подозрителен
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          grep -q "$TODAY" README.md || { echo "КРИТИК: карта не подписана сегодняшним штампом ($TODAY)"; exit 2; }
          grep -Eq 'репо всего[^0-9]*[1-9]' README.md || { echo "КРИТИК: ноль репо — ноль подозрителен"; exit 3; }
          echo "КРИТИК: штамп свежий, счёт ненулевой"

      - name: Коммит карты
        run: |
          git config user.name  "karta-generator"
          git config user.email "karta@rtynbirf.local"
          git add README.md karta.json
          git diff --cached --quiet || git commit -m "karta: ночная перегенерация $(date -u '+%Y-%m-%d') [REVO]"
          git pull --rebase origin main || { echo "REBASE: удалённый ушёл вперёд — честная тревога, следующий прогон возьмёт свежий checkout"; exit 4; }
          git push

      - name: КРИТИК-ФСМ — самопроверка генератора + пульс в git (v4)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v4: если дерево в конфликте (гонка регена с автопилотом) — критик
          # не лезет в сломанное дерево: честный пропуск, следующий тик допишет
          if git status --porcelain | grep -q '^UU'; then
            echo "КРИТИК: дерево в конфликте — тик пропущен честно, пульс допишет следующий прогон"; exit 0
          fi
          python3 scripts/critic.py --root . | tee /tmp/critic.out
          if grep -q 'ACTION: ISSUE_BLIND' /tmp/critic.out; then
            body=$(grep 'ACTION: ISSUE_BLIND' /tmp/critic.out | cut -d'|' -f2-)
            gh issue create -R ${{ github.repository }} --title "ОСЛЕП: генератор после регена ≠ API" --body "$body" || true
          fi
          git config user.name  "karta-critic"
          git config user.email "karta-critic@rtynbirf.local"
          git add karta/state.json
          git diff --cached --quiet || git commit -m "критик: пульс $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
          git pull --rebase origin main || exit 0
          git push || echo "КРИТИК: пуш пульса не прошёл — гонка, следующий тик повторит"

      - name: ТРЕВОГА — ночная перегенерация упала
        if: failure()
        run: |
          # v4: разоружить конфликтное дерево, чтобы тревога ВСЕГДА дошла до витрины
          git rebase --abort 2>/dev/null || true
          git reset --hard origin/main 2>/dev/null || true
          [ -f CRITIC-alarm.md ] || printf '# ЖУРНАЛ ТРЕВОГ СТОРОЖА\n\n| время UTC | вердикт |\n|---|---|\n' > CRITIC-alarm.md
          printf '| %s | ночная перегенерация karta упала — см. лог прогона |\n' "$(date -u '+%Y-%m-%d %H:%M')" >> CRITIC-alarm.md
          git config user.name  "karta-generator"
          git config user.email "karta@rtynbirf.local"
          git add CRITIC-alarm.md
          git diff --cached --quiet || git commit -m "karta: тревога — ночь прошла без карты [skip ci]"
          git pull --rebase origin main || { echo "REBASE: тревогу не удалось записать — гонка пушей"; exit 0; }
          git push || echo "ТРЕВОГА: пуш не прошёл — гонка; тревога видна в логе прогона"
